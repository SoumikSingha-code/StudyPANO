<!DOCTYPE html>
<style>
    :root {
        --bg: #0a0a0f;
        --surface: #13131a;
        --border: #1e1e2e;
        --accent: #7c3aed;
        --accent2: #06b6d4;
        --green: #10b981;
        --red: #ef4444;
        --yellow: #f59e0b;
        --text: #e2e8f0;
        --muted: #64748b;
        --glow: 0 0 40px rgba(124, 58, 237, 0.12);
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Space Grotesk', sans-serif;
        background: var(--bg);
        color: var(--text);
    }

    body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
            linear-gradient(rgba(124, 58, 237, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(124, 58, 237, 0.03) 1px, transparent 1px);
        background-size: 40px 40px;
        pointer-events: none;
        z-index: 0;
    }

    .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        height: 30px;
        border: none;
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.25s;
        white-space: nowrap;
    }

    .btn-primary {
        background: linear-gradient(135deg, var(--accent), #5b21b6);
        color: white;
        box-shadow: 0 4px 20px rgba(124, 58, 237, 0.3);
    }

    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 28px rgba(124, 58, 237, 0.4);
    }

    .btn-danger {
        background: rgba(239, 68, 68, 0.1);
        color: var(--red);
        border: 1px solid rgba(239, 68, 68, 0.25);
    }

    .btn-danger:hover {
        background: rgba(239, 68, 68, 0.2);
    }

    .btn-warning {
        background: rgba(245, 158, 11, 0.1);
        color: var(--yellow);
        border: 1px solid rgba(245, 158, 11, 0.25);
    }

    .btn-warning:hover {
        background: rgba(245, 158, 11, 0.2);
    }

    .btn-ghost {
        background: rgba(255, 255, 255, 0.05);
        color: var(--text);
        border: 1px solid var(--border);
    }

    .btn-ghost:hover {
        background: rgba(255, 255, 255, 0.09);
    }

    h1 {
        font-size: clamp(26px, 5vw, 40px);
        font-weight: 700;
        line-height: 1.15;
        background: linear-gradient(135deg, #fff 30%, var(--accent2));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 10px;
        text-align: center;
        margin-bottom: 40px;
        width: 100%;
        padding: 50px;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    body::-webkit-scrollbar {
        width: 0px;
        z-index: 10000;
    }

    body::-webkit-scrollbar-track {
        background: none;
        border-radius: 10px;
    }

    body::-webkit-scrollbar-thumb {
        background: none;
        border-radius: 10px;
    }

    body::-webkit-scrollbar-thumb:hover {
        background: none;
    }

    #block {
        position: fixed;
        inset: 0;
        background: #1e1e2e;
        z-index: 00;
        transform: translateX(100%);
        opacity: 0;
        overflow: scroll;
    }

    #rev {
        background: none;
        border: none;
        font-size: 25px;
        color: var(--muted);
        text-align: center;
        cursor: pointer;
        padding: 10px;
        transition: color 0.2s;
        user-select: none;
    }

    #rev:hover {
        color: var(--text);
    }

    #ctnt {
        width: 100%;
        height: auto;
        background: #000;
        display: flex;
        flex-wrap: wrap;
        row-gap: 10px;
    }
</style>

<body>

</script>
